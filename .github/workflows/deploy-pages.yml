# 自动部署到 GitHub Pages

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'llm-wiki/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  schedule:
    # 每天自动重新爬取（官网内容可能更新）
    - cron: '0 3 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            llm-wiki

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Generate docs (crawl baomidou.com)
        run: node llm-wiki/scripts/generate-llms.js

      - name: Generate releases page (sync GitHub Releases)
        run: node llm-wiki/scripts/fetch-releases.js

      - name: Build site
        run: |
          mkdir -p _site
          cp -r llm-wiki/. _site/
          cp -r docs _site/docs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      # 回写生成物并在长期无提交时保活，避免 60 天无活动导致 schedule 被禁用
      - name: Commit generated files / keepalive
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 期间若有他人提交，先变基再重推
          push_or_rebase() {
            git push && return 0
            git pull --rebase --autostash
            git push
          }

          # 同步时间戳每天都会变，忽略它以免产生无意义提交
          if [ -n "$(git status --porcelain llm-wiki/releases.html)" ] \
            && git diff --quiet -I 'class="synced"' -- llm-wiki/releases.html; then
            git checkout -- llm-wiki/releases.html
          fi

          if [ -n "$(git status --porcelain llm-wiki/llms-full.txt llm-wiki/releases.html llm-wiki/index.html)" ]; then
            git add llm-wiki/llms-full.txt llm-wiki/releases.html llm-wiki/index.html
            git commit -m "chore(site): 自动同步文档与 Releases [skip ci]"
            push_or_rebase
            exit 0
          fi

          last_commit=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last_commit )) -gt $((45 * 86400)) ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > llm-wiki/.keepalive
            git add llm-wiki/.keepalive
            git commit -m "chore(site): keepalive [skip ci]"
            push_or_rebase
          fi
